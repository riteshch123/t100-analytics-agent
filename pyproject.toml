[project]
name = "t100-agent"
version = "0.1.0"
description = "Natural-language analytics agent over US DOT T-100 aviation data"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "google-cloud-bigquery>=3.25",
]

[project.optional-dependencies]
scrape = ["selenium>=4.20"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=73"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
